<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ANTI-CACHE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Permissions-Policy"
        content="autoplay=*, encrypted-media=*, accelerometer=*, gyroscope=*, picture-in-picture=*, clipboard-write=*, web-share=*">
    <title>UnderLess</title>
    <meta name="description" content="en UnderLess tenés que adivinar artistas y canciones del under argentino.">
    <meta property="og:title" content="UnderLess">
    <meta property="og:description" content="en UnderLess tenés que adivinar artistas y canciones del under argentino.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://underless.vercel.app/img/home_underless.png">
    <meta name="application-name" content="UnderLess">
    <meta name="google-site-verification" content="wJNtyF9L8PONkSvZSHAbqFFadmZrDmITZJYvXF0eivQ">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UnderLess",
        "url": "https://underless.vercel.app/"
    }
    </script>
    <!-- Styles -->
    <link rel="stylesheet" href="underless-sidebar.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="underless-sidebar-trigger-line" onclick="toggleSidebar()" title="Abrir Sidebar"></div>

<!-- TOP ACTIONS (OUTSIDE THE BOX) -->
<div class="underless-global-top-actions" style="position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; pointer-events: none;">
    <div style="pointer-events: auto;">
        <button class="underless-main-sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu" style="background: #242829; border: 1px solid #3a3d3f; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 8px; width: 44px; height: 44px; justify-content: center; align-items: center;">
            <span style="display: block; width: 20px; height: 2px; background: white;"></span>
            <span style="display: block; width: 20px; height: 2px; background: white;"></span>
            <span style="display: block; width: 20px; height: 2px; background: white;"></span>
        </button>
    </div>
    <div class="underless-profile-corner-wrap" data-ul-profile-corner-wrap hidden style="display:none; pointer-events: auto;">
        <a data-ul-profile-corner-link href="/" class="underless-profile-corner-link" style="display: flex; align-items: center; gap: 8px; text-decoration: none; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
            <img data-ul-profile-corner-img src="" alt="" width="28" height="28" class="underless-profile-corner-img" style="border-radius: 50%;" />
            <span data-ul-profile-corner-name class="underless-profile-corner-name" style="color: white; font-size: 0.9em; font-weight: 500;"></span>
        </a>
    </div>
</div>

<!-- SIDEBAR ROOT -->
<div id="underless-sidebar-root">
    <div class="underless-overlay" aria-hidden="true"></div>
    <nav class="underless-sidebar" aria-label="Menu de modos de juego">
        <button type="button" class="underless-sidebar-close-btn" onclick="toggleSidebar()" aria-label="Cerrar">×</button>
        <a href="/" id="underless-sidebar-home" class="underless-sidebar-home-link" aria-label="Volver al inicio del sitio">
            <span class="underless-sidebar-home-text">Home</span>
        </a>

        <div class="underless-social-section">
            <p class="underless-sidebar-label">SOCIAL</p>
            <button type="button" class="underless-mode-option underless-social-nav-btn" data-ul-panel="perfil">MI PERFIL</button>
            <button type="button" class="underless-mode-option underless-social-nav-btn" data-ul-panel="tienda">TIENDA</button>
            <button type="button" class="underless-mode-option underless-social-nav-btn" data-ul-panel="uless">ULESS</button>
        </div>

        <p class="underless-sidebar-label underless-sidebar-label--after-social">MODOS DE JUEGO</p>

        <div class="underless-mode-option underless-mode-normal active" aria-label="Modo UnderLess Normal">
            <img src="img/home_underless.png" alt="" class="mode-icon">
            <span>UNDERLESS</span>
        </div>
        <div class="underless-mode-option underless-mode-underorhigher" aria-label="Modo Under or Higher">
            <img src="img/home_underhigher.png" alt="" class="mode-icon">
            <span>UNDER/HIGHER</span>
        </div>
    </nav>
</div>

<header>
    <a href="/" class="logo" aria-label="Volver al inicio">UnderLess</a>
    <img id="emote-7tv" src="img/peepo-band.gif" alt="peepo band">
</header>

<div class="underless-uoh-game active">
    <header class="game-header">
        <h1 class="game-title"><span class="title-under">Under</span><span class="title-higher">/Higher</span></h1>
        <p class="game-question">¿Cuál tiene <span class="highlight">MÁS</span> oyentes mensuales?</p>
    </header>

    <div class="score-container">
        <div class="score-circle" id="uoh-score-display">0</div>
    </div>

    <main class="cards-container" id="uoh-cards-container">
        <!-- Inline Lose Screen -->
        <div class="uoh-lose-screen" id="uoh-lose-screen">
            <h2 class="uoh-lose-title">PERDISTE</h2>
            <p class="uoh-lose-subtitle">intentalo de nuevo si queres</p>
            <div class="uoh-lose-score">
                <span class="uoh-lose-score-label">Tu racha:</span>
                <span class="uoh-lose-score-value" id="uoh-lose-score-value">0</span>
            </div>
            <div class="uoh-lose-buttons">
                <button class="uoh-lose-btn uoh-play-again-btn" onclick="UnderlessSidebar.playAgain()">Jugar de nuevo</button>
                <button class="uoh-lose-btn uoh-exit-btn" onclick="UnderlessSidebar.selectMode('normal')">Ir a UNDERLESS</button>
            </div>
        </div>

        <!-- Card Left -->
        <div class="artist-card" id="uoh-card-left">
            <div class="card-image-container">
                <img class="card-image" id="uoh-img-left" src="" alt="Artista 1">
                <div class="result-overlay wrong" id="uoh-overlay-left-wrong"></div>
                <div class="result-overlay correct" id="uoh-overlay-left-correct"></div>
            </div>
            <div class="card-info">
                <p class="artist-name" id="uoh-name-left">"Artista"</p>
                <div class="listeners-section">
                    <p class="listeners-count" id="uoh-count-left">0</p>
                </div>
            </div>
        </div>

        <!-- VS Divider -->
        <div class="vs-divider">VS</div>

        <!-- Card Right -->
        <div class="artist-card" id="uoh-card-right">
            <div class="card-image-container">
                <img class="card-image" id="uoh-img-right" src="" alt="Artista 2" onclick="UnderlessSidebar.handleCardClick('right')">
                <div class="result-overlay wrong" id="uoh-overlay-right-wrong"></div>
                <div class="result-overlay correct" id="uoh-overlay-right-correct"></div>
            </div>
            <div class="card-info">
                <p class="artist-name" id="uoh-name-right">"Artista"</p>
                <div class="listeners-section">
                    <p class="listeners-count" id="uoh-count-right">0</p>
                </div>
                <div class="uoh-actions">
                    <button class="uoh-btn uoh-btn-higher" onclick="UnderlessSidebar.handleCardClick('right')">MÁS</button>
                    <button class="uoh-btn uoh-btn-under" onclick="UnderlessSidebar.handleCardClick('left')">MENOS</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="sample-artists.js"></script>
<script defer src="/js/underless-profile-corner.js"></script>
<script src="underless-sidebar.js"></script>
</body>
</html>
