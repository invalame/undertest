<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ANTI-CACHE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Permissions-Policy"
        content="autoplay=*, encrypted-media=*, accelerometer=*, gyroscope=*, picture-in-picture=*, clipboard-write=*, web-share=*">
    <title>UnderLess</title>
    <meta name="description" content="en UnderLess tenés que adivinar artistas y canciones del under argentino.">
    <meta property="og:title" content="UnderLess">
    <meta property="og:description"
        content="en UnderLess tenés que adivinar artistas y canciones del under argentino.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://invalame.github.io/UnderLess/img/home_underless.png">
    <meta name="application-name" content="UnderLess">
    <meta name="google-site-verification" content="1w6pqcfcAv3jp6XGeAkgJrlF-pl88fDfLPT8aDDNAn0" />
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UnderLess",
        "url": "https://invalame.github.io/UnderLess/"
    }
    </script>
    <!-- Styles -->
    <link rel="stylesheet" href="underless-sidebar.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="underless-sidebar-trigger-line" onclick="toggleSidebar()" title="Abrir Sidebar"></div>

<!-- TOP ACTIONS (OUTSIDE THE BOX) -->
<div class="underless-global-top-actions" style="position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; pointer-events: none;">
    <div style="pointer-events: auto;">
        <button class="underless-main-sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu" style="background: #242829; border: 1px solid #3a3d3f; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 8px; width: 44px; height: 44px; justify-content: center; align-items: center;">
            <span style="display: block; width: 20px; height: 2px; background: white;"></span>
            <span style="display: block; width: 20px; height: 2px; background: white;"></span>
            <span style="display: block; width: 20px; height: 2px; background: white;"></span>
        </button>
    </div>
</div>

<!-- SIDEBAR ROOT -->
<div id="underless-sidebar-root">
    <div class="underless-overlay" aria-hidden="true"></div>
    <nav class="underless-sidebar" aria-label="Menu de modos de juego">
        <button type="button" class="underless-sidebar-close-btn" onclick="toggleSidebar()" aria-label="Cerrar">×</button>
        <a href="/" id="underless-sidebar-home" class="underless-sidebar-home-link" aria-label="Volver al inicio del sitio">
            <span class="underless-sidebar-home-text">Home</span>
        </a>

        <div class="underless-social-section">
            <p class="underless-sidebar-label">SOCIAL</p>
            <button type="button" class="underless-mode-option underless-social-nav-btn" data-ul-panel="perfil">MI PERFIL</button>
            <button type="button" class="underless-mode-option underless-social-nav-btn" data-ul-panel="tienda">TIENDA</button>
            <button type="button" class="underless-mode-option underless-social-nav-btn" data-ul-panel="uless">ULESS</button>
        </div>

        <p class="underless-sidebar-label underless-sidebar-label--after-social">MODOS DE JUEGO</p>

        <div class="underless-mode-option underless-mode-normal active" aria-label="Modo UnderLess Normal">
            <img src="img/home_underless.png" alt="" class="mode-icon">
            <span>UNDERLESS</span>
        </div>
        <div class="underless-mode-option underless-mode-underorhigher" aria-label="Modo Under or Higher">
            <img src="img/home_underhigher.png" alt="" class="mode-icon">
            <span>UNDER/HIGHER</span>
        </div>
        
        <div class="sidebar-footer">
            <div data-ul-sidebar-profile-wrap hidden style="display:none; position: relative;">
                <div class="sidebar-profile-menu" data-ul-sidebar-profile-menu>
                    <a href="/" data-ul-sidebar-profile-link class="sidebar-profile-menu-item">Mi perfil</a>
                    <form action="/auth/signout" method="post" style="margin: 0;">
                        <button type="submit" class="sidebar-profile-menu-item logout">Cerrar sesión</button>
                    </form>
                </div>
                <button type="button" class="sidebar-profile-toggle" data-ul-sidebar-profile-toggle>
                    <img data-ul-sidebar-profile-img src="" alt="" class="sidebar-profile-img" referrerpolicy="no-referrer" />
                    <span data-ul-sidebar-profile-name style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;"></span>
                </button>
            </div>
            <div class="underless-social-buttons">
                <a href="https://x.com/Invalame" target="_blank" class="underless-social-btn underless-twitter-btn" title="Twitter">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                    </svg>
                </a>
                <a href="https://youtube.com/@UnderLesss" target="_blank" class="underless-social-btn underless-youtube-btn" title="YouTube">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                    </svg>
                </a>
            </div>
        </div>
    </nav>
</div>

<header>
    <a href="/" class="logo" aria-label="Volver al inicio">UnderLess</a>
    <img id="emote-7tv" src="img/peepo-band.gif" alt="peepo band">
</header>

<div class="mode-artist-container" id="mode-artist-container">
    <div class="mode-selector">
        <div class="mode-indicator"></div>
        <button id="mode-normal" class="mode-button active" onclick="switchMode('normal')">Normal</button>
        <button id="mode-artist" class="mode-button" onclick="switchMode('artist')">Artista</button>
        <button id="mode-album" class="mode-button" onclick="switchMode('album')">Album</button>
    </div>

    <div id="artist-section">
        <div id="current-artist-display">Selecciona un artista</div>
        <div class="artist-search-container">
            <div class="search-container">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20.29 21l.71-.71L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5z" />
                </svg>
                <input type="text" class="search-input" id="artist-search-input" placeholder="Buscar artista..." autocomplete="off">
            </div>
            <div id="artist-list" class="songs-list"></div>
        </div>
    </div>

    <div id="album-section">
        <div class="artist-search-container">
            <div class="search-container">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z" />
                </svg>
                <input type="text" class="search-input" id="album-search-input" placeholder="Buscar álbum..." autocomplete="off">
            </div>
            <div id="album-list" class="songs-list"></div>
        </div>
    </div>
</div>

<main>
    <div class="game-board-wrapper">
        <div class="guess-boxes" id="guess-boxes">
            <div class="guess-box"></div>
            <div class="guess-box"></div>
            <div class="guess-box"></div>
            <div class="guess-box"></div>
            <div class="guess-box"></div>
            <div class="guess-box"></div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-bar-container" id="progress-bar">
                <div class="segments-overlay" id="segments-overlay"></div>
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <span class="timer-text" id="current-timer-text" style="left:0%">0.5s</span>
        </div>

        <div id="album-art-container">
            <div id="album-label">ALBUM ELEGIDO</div>
            <img id="album-art-display" src="" alt="Album Art">
            <div id="album-name-display"></div>
        </div>

        <button class="play-button" id="play-button" onclick="playSnippet()" disabled aria-label="escuchar fragmento">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round" />
            </svg>
        </button>

        <div class="search-controls-container">
            <div class="controls-row">
                <div class="search-container" id="search-container">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20.29 21l.71-.71L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Busca un banger..." autocomplete="off">
                    <div id="songs-list" class="songs-list" aria-hidden="true"></div>
                </div>
                <button id="skip-button-standalone" onclick="handleSkip()">Skip</button>
            </div>
            <div id="streak-saver-ui" onclick="openLifeModal()" style="cursor: pointer;" title="Ver info de vidas">
                salvadores de racha: 3
            </div>
        </div>

        <div id="streak"><img id="streak-icon" src="img/racha_fuego_gris.png" alt="racha"><span id="streak-number">0</span></div>
    </div>
</main>

<div id="game-over-message" role="dialog" aria-modal="true">
    <div class="game-over-content" id="game-over-content">
        <div class="game-over-header">
            <h2 id="game-result"></h2>
        </div>
        <div class="game-over-body">
            <div id="correct-answer-container">
                <span class="label" id="answer-label"></span>
                <span id="correct-answer"></span>
            </div>
            <button class="action-button play-again-button" onclick="resetGame(true)">una ma</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script defer src="/js/underless-profile-corner.js"></script>
<script src="underless-sidebar.js"></script>
</body>
</html>
