<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderLess - Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <div id="home-root">
        <header style="margin-top: 10vh; display: flex; flex-direction: column; align-items: center;">
            <h1 class="logo" style="margin-bottom: 5px; font-size: 4em;">UnderLess</h1>
            <img src="img/peepo-band.gif" alt="peepo band"
                style="width: clamp(110px, 12vw, 170px); height: auto; margin-bottom: 10px; margin-top: 5px;">
        </header>

        <main class="home-main">
            <!-- Google Login Button -->
            <button class="home-btn google-btn" onclick="alert('Próximamente: Registro con Google')">
                <img src="img/Google_Favicon.png" alt="Google">
                Registrarse con Google
            </button>

            <!-- Offline Play Button -->
            <a href="/underless" class="home-btn offline-btn">
                Jugar Offline
            </a>
            <p class="offline-warning">(Las funciones sociales estarán restringidas)</p>


            </a>
    </div>
    </main>
    </div>
</body>

</html>
